<svg xmlns="http://www.w3.org/2000/svg" width="840" height="204" viewBox="0 0 840 204" role="img" aria-label="murat: sap developer by day, app and ai tinkerer by night">
<style>
text{font-family:ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace;font-size:15px}
.r0,.r1,.r2,.r3{transform-box:fill-box;transform-origin:left center}
@keyframes tip{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes show{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
.r0{animation:tip 0.45s steps(10,end) 0.30s both}.r1{animation:tip 2.52s steps(56,end) 1.20s both}.r2{animation:tip 0.54s steps(12,end) 4.17s both}.r3{animation:tip 2.56s steps(57,end) 5.16s both}.last{animation:show 0s 8.18s both}.cur{animation:blink 1s steps(1) 8.18s infinite}
@media (prefers-reduced-motion:reduce){.r0,.r1,.r2,.r3,.last,.cur{animation:none}}
</style>
